P.overview={n:'The question',h:()=>`<h1>How does a video end up on the trending list?</h1><p class="sub">Project: YouTube trending videos dataset, view and engagement pattern analysis across categories and regions. Click each stage to see what happens behind the scenes and what the data shows.</p>
<div class="card"><div class="stages" id="st"></div><div class="big" id="sd" style="margin-top:18px"></div></div>
<div class="g g4">${[['Trending records',fmt(K.rows)],['Unique videos',fmt(K.videos)],['Channels',fmt(K.channels)],['Countries','US and Canada']].map(k=>`<div class="card kpi"><div class="n">${k[1]}</div><div class="l">${k[0]}</div></div>`).join('')}</div>
<p class="sub" style="margin:0">Daily trending lists from ${K.from} to ${K.to}.</p>`,

<div class="card"><h3>Role in the story</h3><div class="big" id="cd"></div><h3 style="margin-top:24px">Not in the data</h3><div class="chips"><span class="chip off">watch time</span><span class="chip off">click-through rate</span><span class="chip off">audience retention</span><span class="chip off">shares</span><span class="chip off">hourly views</span></div></div></div>`,
 i:()=>{const sel=i=>{[...$('ct').rows].forEach((r,j)=>r.classList.toggle('on',j==i));$('cd').innerHTML=`<p><b>${COLS[i][0]}</b> (${COLS[i][1]})</p><p>${COLS[i][2]}</p>`};$('ct').onclick=e=>{const r=e.target.closest('tr');r&&sel(+r.dataset.i)};sel(0)}};
const CD=[`${fmt(CL[0][1])} rows from the US and Canada files.`,`${fmt(CL[0][1]-CL[1][1])} repeated rows (same video, same day, same country) dropped.`,`${fmt(CL[1][1]-CL[2][1])} rows with missing key fields dropped. Missing descriptions are kept.`,`${fmt(CL[2][1]-CL[3][1])} rows dropped for unreadable dates. Dates are now real timestamps.`,`${fmt(CL[3][1]-CL[4][1])} rows dropped for unknown categories. category_id becomes names like Music.`,`${fmt(D.cap)} rows are above the 99th percentile of views and are flagged as outliers.`,`Features added for ${fmt(K.videos)} unique videos.`];
const FE={engagement_rate:'(likes + comments) / views × 100',like_ratio:'likes / views',comment_ratio:'comments / views',days_to_trend:'first trending date − publish date',trending_days:'number of days a video appears on the list',upload_hour:'hour of publish_time (UTC)',upload_weekday:'weekday of publish_time',title_length:'characters in title',tag_count:'number of tags'};
P.clean={n:'Cleaning',h:()=>`<h1>Turning raw files into an analysis table</h1><p class="sub">Move the slider or click a bar to step through the pipeline.</p>
<div class="card"><div class="ch" style="height:240px"><canvas id="a"></canvas></div><div class="ctl" style="margin-top:14px">Step: <b id="sn"></b><input id="sl" type="range" min="0" max="6" value="0"></div><div class="big" id="sx"></div></div>
<div class="card"><h3>Engineered features (click to see the formula)</h3><div class="chips" id="fc">${Object.keys(FE).map(f=>`<button class="chip" data-o="${f}">${f}</button>`).join('')}</div><div class="big" id="fx">Pick a feature.</div></div>`,
 i:()=>{const ch=mk('a',{type:'bar',data:{labels:CL.map(c=>c[0]),datasets:[{data:CL.map(c=>c[1]),borderRadius:6}]},options:{maintainAspectRatio:false,scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{beginAtZero:true}},onClick:(e,el)=>el.length&&set(el[0].index)}});
 const set=i=>{$('sl').value=i;$('sn').textContent=CL[i][0];ch.data.datasets[0].backgroundColor=CL.map((_,j)=>j==i?C.c:j<i?C.v:C.g);ch.update();$('sx').innerHTML=`<p><b>${fmt(CL[i][1])} rows.</b> ${CD[i]}</p>`};
 $('sl').oninput=e=>set(+e.target.value);set(0);
 $('fc').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('fc').children].forEach(x=>x.classList.toggle('on',x==b));$('fx').innerHTML=`<p><code>${b.dataset.o}</code> = ${FE[b.dataset.o]}</p>`}}};
P.upload={n:'Upload',h:()=>`<h1>Step 1: the upload</h1><p class="sub">Before anything else, the creator chooses a category and a moment. Choose a category, switch between hour and weekday, and click a bar.</p>
<div class="card"><div class="chips" id="c1"></div><div class="chips" id="c2"></div><div class="ch tall"><canvas id="a"></canvas></div>${cap('Click a bar.')}</div>`,
 i:()=>{let cat=CAT[0],mode='By hour';const ch=mk('a',{type:'bar',data:{labels:[],datasets:[{data:[],borderRadius:6}]},options:{maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{title:{display:true,text:''}}},onClick:(e,el)=>{if(!el.length)return;const i=el[0].index,v=ch.data.datasets[0].data[i];ins(mode=='By hour'?`${i}:00 UTC holds ${v}% of ${cat} trending uploads.`:`${cat} videos uploaded on ${WD[i]} reach an engagement rate of ${v}%.`)}}});
 const set=()=>{let l,d;if(mode=='By hour'){l=[...Array(24).keys()];d=D.hour[cat]}else{l=WD;d=D.wday[cat]}
 ch.data.labels=l;ch.data.datasets[0].data=d;ch.data.datasets[0].backgroundColor=CC[CAT.indexOf(cat)];ch.options.scales.y.title.text=mode=='By hour'?'share of trending uploads (%)':'average engagement rate (%)';ch.update();ins(mode=='By hour'?`${cat} videos that trend are most often uploaded at ${D.peak[cat]}:00 UTC.`:`${cat} videos uploaded on ${WD[D.bestwd[cat]]} have the highest average engagement rate (${D.wday[cat][D.bestwd[cat]]}%).`)};
 chips('c1',CAT,cat,v=>{cat=v;set()});chips('c2',['By hour','By weekday'],mode,v=>{mode=v;set()})}};
P.early={n:'Early traction',h:()=>`<h1>Step 2: early traction</h1><p class="sub">Videos that trend usually earn likes and comments quickly. Click legend items to hide categories, switch the metric, or click a point. Each dot is one video on its first trending day.</p>
<div class="card"><div class="chips" id="c1"></div><div class="ch tall"><canvas id="a"></canvas></div>${cap('Click a point.')}</div>`,
 i:()=>{let met='Likes';const ix=()=>met=='Likes'?1:2;
 const ch=mk('a',{type:'scatter',data:{datasets:CAT.map((c,i)=>({label:c,data:[],backgroundColor:CC[i]+'88',pointRadius:3.5,pointHoverRadius:7}))},options:{maintainAspectRatio:false,plugins:{legend:{display:true,labels:{usePointStyle:true,boxWidth:8}}},scales:{x:{title:{display:true,text:'log10 views'}},y:{title:{display:true,text:''}}},onClick:(e,el)=>{if(!el.length)return;const p=ch.data.datasets[el[0].datasetIndex].data[el[0].index];ins(`A ${CAT[el[0].datasetIndex]} video with ${fm(10**p.x)} views had ${fm(10**p.y)} ${met.toLowerCase()}.`)}}});
 const set=()=>{ch.data.datasets.forEach((d,i)=>d.data=D.sc[CAT[i]].map(p=>({x:p[0],y:p[ix()]})));ch.options.scales.y.title.text='log10 '+met.toLowerCase();ch.update();ins(`Views and ${met.toLowerCase()} move together across all ${fmt(K.videos)} videos (r = ${met=='Likes'?D.r.likes:D.r.comm}). Showing 60 videos per category.`)};
 chips('c1',['Likes','Comments'],met,v=>{met=v;set()})}};
P.lag={n:'Time to trend',h:()=>`<h1>Step 3: how long until it trends</h1><p class="sub">The gap between publishing and first appearing on the list. Drag the slider to see how many videos trend within N days, or click a bar.</p>
<div class="card"><div class="chips" id="c1"></div><div class="ch"><canvas id="a"></canvas></div><div class="ctl" style="margin-top:14px">Within <b id="nv"></b> day(s)<input id="sl" type="range" min="0" max="10" value="2"></div>${cap('')}</div>`,
 i:()=>{let cat=CAT[0];const ch=mk('a',{type:'bar',data:{labels:[...Array(11).keys(),'11+'],datasets:[{data:[],borderRadius:5}]},options:{maintainAspectRatio:false,scales:{x:{grid:{display:false},title:{display:true,text:'days from publish to trending'}},y:{title:{display:true,text:'share of videos (%)'}}},onClick:(e,el)=>el.length&&el[0].index<11&&($('sl').value=el[0].index,set())}});
 const set=()=>{const d=D.lag[cat],n=+$('sl').value,cum=d.slice(0,n+1).reduce((a,b)=>a+b);ch.data.datasets[0].data=d;ch.data.datasets[0].backgroundColor=d.map((_,i)=>i<=n?C.c:C.g);ch.update();$('nv').textContent=n;ins(`${cum.toFixed(0)}% of ${cat} videos trend within ${n} day(s). The average gap is ${D.lagm[cat]} days; ${low(D.lagm,x=>x)} is fastest and ${hi(D.lagm,x=>x)} slowest.`)};
 $('sl').oninput=set;chips('c1',CAT,cat,v=>{cat=v;set()})}};
P.stay={n:'Staying on the list',h:()=>`<h1>Step 4: staying on the list</h1><p class="sub">Once listed, views keep growing for a few days. Click legend items to compare categories and switch between daily and total views.</p>
<div class="card"><div class="chips" id="c1"></div><div class="ch tall"><canvas id="a"></canvas></div>${cap('')}</div>`,
 i:()=>{let m='Daily views';
 const ch=mk('a',{type:'line',data:{labels:[...Array(12).keys()].map(d=>'Day '+(d+1)),datasets:CAT.map((c,i)=>({label:c,data:[],borderColor:CC[i],backgroundColor:CC[i],borderWidth:2,pointRadius:2,pointHoverRadius:6,tension:.3}))},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,labels:{usePointStyle:true,boxWidth:8}}},scales:{x:{grid:{display:false}},y:{title:{display:true,text:''}}}}});
 const set=()=>{ch.data.datasets.forEach((d,i)=>d.data=D.stay[CAT[i]][m=='Daily views'?'day':'tot']);ch.options.scales.y.title.text=(m=='Daily views'?'views gained that day':'total views')+' (millions, average)';ch.update();const t=hi(D.stayd,x=>x);ins(`${t} videos stay longest on the list (${D.stayd[t]} days on average); ${low(D.stayd,x=>x)} videos leave after ${D.stayd[low(D.stayd,x=>x)]} days. Lines get noisier on later days because fewer videos last that long.`)};
 chips('c1',['Daily views','Total views'],m,v=>{m=v;set()})}};
P.reg={n:'Where it spreads',h:()=>`<h1>Step 5: where it trends</h1><p class="sub">The same category behaves differently in the US and Canada. Switch the metric and click any bar.</p>
<div class="g g2"><div class="card"><div class="chips" id="c1"></div><div class="ch"><canvas id="a"></canvas></div>${cap('Click a bar.')}</div>
<div class="card"><h3>Videos that trended in both countries</h3><div class="out">${fmt(D.both.n)}</div><p class="sub" style="margin:8px 0 18px">${D.both.pctUS}% of US trending videos and ${D.both.pctCA}% of Canadian ones.</p>
<div class="chips" id="c2"></div><div class="big" id="bd"></div></div></div>`,
 i:()=>{const M={'Engagement rate (%)':'eng','Share of country’s list (%)':'share','Average views (millions)':'views','Average days on list':'days'};let cur='Engagement rate (%)';
 const ch=mk('a',{type:'bar',data:{labels:CAT,datasets:['US','CA'].map((k,i)=>({label:k,data:[],backgroundColor:i?C.v:C.c,borderRadius:5}))},options:{maintainAspectRatio:false,plugins:{legend:{display:true,labels:{usePointStyle:true,boxWidth:8}}},scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{title:{display:true,text:''}}},onClick:(e,el)=>{if(!el.length)return;const c=CAT[el[0].index],k=el[0].datasetIndex?'CA':'US';ins(`${c} in ${k=='US'?'the US':'Canada'}: ${D.reg[k][c][M[cur]]} (${cur}).`)}}});
 const set=v=>{cur=v;ch.data.datasets.forEach((d,i)=>d.data=CAT.map(c=>D.reg[i?'CA':'US'][c][M[cur]]));ch.options.scales.y.title.text=cur;ch.update();const a=hi(D.reg.US,x=>x[M[cur]]),b=hi(D.reg.CA,x=>x[M[cur]]);ins(`Highest ${cur.toLowerCase()}: ${a} in the US, ${b} in Canada. Click a bar for exact values.`)};
 chips('c1',Object.keys(M),cur,set);
 const B=D.both,txt={'Who trended first?':`${B.usFirst}% reached the US list first, ${B.caFirst}% reached Canada first, and ${B.same}% appeared on both the same day.`,'How far apart?':`On average the two appearances are ${B.gap} days apart.`};
 chips('c2',Object.keys(txt),'Who trended first?',k=>$('bd').innerHTML=`<p>${txt[k]}</p>`)}};
P.stats={n:'Proof',h:()=>`<h1>Is the pattern real or luck?</h1><p class="sub">Tests run on ${fmt(K.videos)} videos. Move the significance level to see which results hold. Click a card to see how to read it.</p>
<div class="card"><div class="ctl">Significance level α = <b id="av"></b><input id="sl" type="range" min="1" max="100" value="50"></div></div><div class="g g2" id="tc"></div>`,
 i:()=>{const T=D.stats,open={};const draw=()=>{const a=+$('sl').value/1000;$('av').textContent=a.toFixed(3);$('tc').innerHTML=T.map((t,i)=>{const s=t[3]<a;return`<div class="card sc" data-i="${i}"><h3>${t[0]}</h3><p style="margin:0 0 10px;color:var(--t2);font-size:13.5px">${t[1]}</p><p style="margin:0 0 10px"><code>${t[2]}</code> &nbsp; <code>p ${t[3]<.001?'< 0.001':'= '+t[3].toFixed(3)}</code></p><span class="tag ${s?'sig':'ns'}">${s?'Significant: '+t[4]:'Not significant at this α'}</span>${open[i]?`<p class="cap" style="min-height:0">If p is below α, the pattern is unlikely to be chance. Here p ${s?'is below':'is not below'} ${a.toFixed(3)}.</p>`:''}</div>`}).join('')};
 $('sl').oninput=draw;$('tc').onclick=e=>{const c=e.target.closest('.sc');if(c){open[c.dataset.i]=!open[c.dataset.i];draw()}};draw()}};
const MD=D.model,LN=D.lin,LG=D.log,RG=D.rng,FN=['Likes','Comments','Tag count','Category','Upload hour'];
P.model={n:'Prediction',h:()=>`<h1>Can we predict it?</h1><p class="sub">Four models trained on ${fmt(D.nm)} videos to predict first-day views from likes, comments, tags, category and upload hour (tested on a held-out 20%). Pick a model, then try the what-if sliders.</p>
<div class="g g2"><div class="card"><div class="chips" id="c1"></div><div class="big" id="ms" style="margin-bottom:16px"></div><div class="ch" style="height:230px"><canvas id="a"></canvas></div></div>
<div class="card"><h3>What-if</h3><div class="ctl">Likes: <b id="v1"></b><input id="s1" type="range" min="${RG.ll[0]}" max="${RG.ll[1]}" step=".05" value="${(RG.ll[0]+RG.ll[1])/2}"></div><div class="ctl">Comments: <b id="v2"></b><input id="s2" type="range" min="${RG.lc[0]}" max="${RG.lc[1]}" step=".05" value="${(RG.lc[0]+RG.lc[1])/2}"></div><div class="ctl">Tags: <b id="v3"></b><input id="s3" type="range" min="0" max="${RG.tags[1]}" value="${Math.round(RG.tags[1]/2)}"></div>
<div class="ctl" style="margin-top:20px">Predicted views</div><div class="out" id="o1"></div><div class="ctl" style="margin-top:12px">Chance of staying 5+ days on the list</div><div class="out" id="o2"></div><p class="cap" style="min-height:0">Across all videos, ${LG.base}% stay 5 days or more.</p></div></div>`,
 i:()=>{const ch=mk('a',{type:'bar',data:{labels:FN,datasets:[{data:[],backgroundColor:C.c,borderRadius:6}]},options:{indexAxis:'y',maintainAspectRatio:false,scales:{y:{grid:{display:false}},x:{title:{display:true,text:'feature importance'}}}}});
 chips('c1',Object.keys(MD),'Random Forest',m=>{const d=MD[m];ch.data.datasets[0].data=d[3];ch.update();$('ms').innerHTML=`<b>${m}</b>: MAE ${d[0]}, RMSE ${d[1]}, R² ${d[2]} (log10 views). A typical prediction is off by about ×${(10**d[0]).toFixed(1)}.`});
 const u=()=>{const l=+$('s1').value,c=+$('s2').value,t=+$('s3').value;$('v1').textContent=fm(10**l);$('v2').textContent=fm(10**c);$('v3').textContent=t;$('o1').textContent=fm(10**(LN.b+LN.c[0]*l+LN.c[1]*c+LN.c[2]*t));$('o2').textContent=Math.round(100/(1+Math.exp(-(LG.b+LG.c[0]*l+LG.c[1]*c+LG.c[2]*t))))+'%'};['s1','s2','s3'].forEach(i=>$(i).oninput=u);u()}};
const SC=D.scale;
P.spark={n:'Scale',h:()=>`<h1>Doing it at scale</h1><p class="sub">The same category aggregation, timed in Pandas and PySpark on this data repeated up to ${SC[SC.length-1][0]} million rows (run on one machine). Drag the slider or click a point.</p>
<div class="card"><div class="stages"><span class="chip off">CSV files</span><i>→</i><span class="chip off">PySpark DataFrame</span><i>→</i><span class="chip off">Clean and transform</span><i>→</i><span class="chip off">Aggregate</span><i>→</i><span class="chip off">Spark SQL</span><i>→</i><span class="chip off">Dashboard</span></div></div>
<div class="g g2"><div class="card"><div class="ch"><canvas id="a"></canvas></div><div class="ctl" style="margin-top:14px">Rows: <b id="nv"></b> million<input id="sl" type="range" min="0" max="${SC.length-1}" value="2"></div>${cap('')}</div>
<div class="card"><h3>Category aggregation in Spark SQL</h3><pre><b>df</b>.createOrReplaceTempView("videos")
spark.sql("""
  SELECT country, category_id,
         AVG(views) AS avg_views,
         SUM(likes) AS total_likes
  FROM videos
  GROUP BY country, category_id
""").show()</pre><p class="cap" style="min-height:0">Spark session start-up: ${D.sparkstart} s (one time).</p></div></div>`,
 i:()=>{const ch=mk('a',{type:'line',data:{datasets:[{label:'Pandas',data:SC.map(r=>({x:r[0],y:r[1]})),borderColor:C.v,backgroundColor:C.v,borderWidth:2,pointRadius:3},{label:'PySpark',data:SC.map(r=>({x:r[0],y:r[2]})),borderColor:C.c,backgroundColor:C.c,borderWidth:2,pointRadius:3},{label:'Selected',data:[],showLine:false,pointRadius:8,backgroundColor:'#F3F7FF'}]},options:{maintainAspectRatio:false,parsing:false,plugins:{legend:{display:true,labels:{usePointStyle:true,boxWidth:8}}},scales:{x:{type:'linear',title:{display:true,text:'rows (millions)'}},y:{title:{display:true,text:'seconds'}}},onClick:(e,el)=>el.length&&el[0].datasetIndex<2&&($('sl').value=el[0].index,set())}});
 const set=()=>{const r=SC[+$('sl').value];$('nv').textContent=r[0];ch.data.datasets[2].data=[{x:r[0],y:r[1]},{x:r[0],y:r[2]}];ch.update('none');ins(`At ${r[0]}M rows Pandas took ${r[1]} s and Spark ${r[2]} s. ${r[1]<r[2]?'On one machine Pandas is faster. Spark’s advantage appears when data no longer fits in one machine’s memory.':'Spark is faster here.'}`)};
 $('sl').oninput=set;set()}};
const bm=hi(MD,x=>x[2]);
const TK=[['Upload',`${CAT[0]} peaks at ${D.peak[CAT[0]]}:00 UTC and ${CAT[5]} at ${D.peak[CAT[5]]}:00; weekday engagement differs by category.`,'upload'],['Early traction',`Views, likes and comments move together (r = ${D.r.likes} and ${D.r.comm}).`,'early'],['Time to trend',`Half of videos trend within ${D.lagmed} day(s); ${D.lag3}% within 3 days.`,'lag'],['Staying on the list',`${hi(D.stayd,x=>x)} lasts ${D.stayd[hi(D.stayd,x=>x)]} days on average; ${low(D.stayd,x=>x)} only ${D.stayd[low(D.stayd,x=>x)]}.`,'stay'],['Where it spreads',`${fmt(D.both.n)} videos trended in both the US and Canada, ${D.both.same}% on the same day.`,'reg'],['Prediction',`${bm} predicts views best (R² ${MD[bm][2]}), led by ${FN[MD[bm][3].indexOf(Math.max(...MD[bm][3]))].toLowerCase()}.`,'model']];
P.end={n:'Takeaways',h:()=>`<h1>How a video gets trending</h1><p class="sub">The full story in six lines. Click any to revisit that step.</p>
<div class="g g2">${TK.map(t=>`<div class="card sc" data-k="${t[2]}"><h3>${t[0]}</h3><p style="margin:0;color:var(--t2)">${t[1]}</p></div>`).join('')}</div>
<div class="big"><p><b>Bottom line.</b> Videos that trend are the ones whose views, likes and comments build up quickly after upload. How long they stay on the list depends on their category.</p></div>`,
 i:()=>{document.querySelector('#p-end .g').onclick=e=>{const c=e.target.closest('.sc');c&&go(c.dataset.k)}}};
const ids=Object.keys(P),nav=$('nav'),main=$('main');
ids.forEach((k,i)=>{nav.insertAdjacentHTML('beforeend',`${i==3||i==8?'<hr>':''}<a data-k="${k}" tabindex="0"><i>${i>=3&&i<=7?i-2:''}</i>${P[k].n}</a>`);main.insertAdjacentHTML('beforeend',`<section id="p-${k}"></section>`)});
function go(k){if(!P[k])k='overview';live.forEach(c=>c.destroy());live=[];ids.forEach(i=>{$('p-'+i).classList.toggle('on',i==k);if(i!=k)$('p-'+i).innerHTML=''});nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));$('p-'+k).innerHTML=P[k].h();P[k].i&&P[k].i();window.scrollTo(0,0);try{history.replaceState(null,'','#'+k)}catch(e){}}
nav.onclick=e=>{const a=e.target.closest('a');a&&go(a.dataset.k)};nav.onkeydown=e=>{if(e.key=='Enter'){const a=e.target.closest('a');a&&go(a.dataset.k)}};
go(location.hash.slice(1));
</script></body></html>
